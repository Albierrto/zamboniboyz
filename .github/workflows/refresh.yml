name: refresh
# Pulls this season's NHL stats and rewrites docs/data/live.json (in-season projection updates,
# breakout chances, "not playing lately" flags). GitHub delays or drops some scheduled runs,
# so it runs every 3 hours at an off-peak minute; a missed slot is covered by the next one.
on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 4 * * *"
    - cron: "23 7 * * *"
    - cron: "23 10 * * *"
    - cron: "23 13 * * *"
    - cron: "23 16 * * *"
    - cron: "23 19 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull season stats and update projections
        run: python build/live.py
      - name: Commit live.json
        run: |
          git config user.name "zamboniboyz-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "live stats $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
